<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><style></style><rect width="900" height="300" rx="14" fill="#14141c"/><rect x="40" y="28" width="390" height="244" rx="12" fill="#1d1d29"/><text x="64" y="66" class="" fill="#8b8a99" font-size="20" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve">Without bang-prefill</text><rect x="470" y="28" width="390" height="244" rx="12" fill="#1d1d29"/><text x="494" y="66" class="" fill="#d97757" font-size="20" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve">With bang-prefill</text><text x="64" y="108" class="" fill="#8b8a99" font-size="16" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve">1.</text><text x="92" y="108" class="" fill="#e8e6e3" font-size="16" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve">Select the command</text><text x="64" y="140" class="" fill="#8b8a99" font-size="16" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve">2.</text><text x="92" y="140" class="" fill="#e8e6e3" font-size="16" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve">Copy it</text><text x="64" y="172" class="" fill="#8b8a99" font-size="16" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve">3.</text><text x="92" y="172" class="" fill="#e8e6e3" font-size="16" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve">Paste it, drop the backticks</text><text x="64" y="204" class="" fill="#8b8a99" font-size="16" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve">4.</text><text x="92" y="204" class="" fill="#e8e6e3" font-size="16" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve">Run it</text><text x="64" y="236" class="" fill="#8b8a99" font-size="16" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve">5.</text><text x="92" y="236" class="" fill="#e8e6e3" font-size="16" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve">Type &quot;look at the output&quot;</text><rect x="530" y="112" width="140" height="56" rx="10" fill="#d97757"/><text x="600" y="148" class="" fill="#14141c" font-size="22" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">Enter ⏎</text><text x="494" y="210" class="" fill="#e8e6e3" font-size="16" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve">The command is already in your prompt.</text><text x="494" y="238" class="" fill="#e8e6e3" font-size="16" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve">Claude reads the output and keeps going.</text></svg>
